<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Contacts - Employee Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>EMS</h1>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="new-contact.html" class="nav-link">New Contact</a>
                </li>
                <li class="nav-item">
                    <a href="view-contacts.html" class="nav-link active">View All Contacts</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Content Section -->
    <div class="container">
        <section class="table-section">
            <h1 class="page-title">Employee Directory</h1>
            <p class="section-description">View and manage all employee contacts</p>

            <div class="table-controls">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-box" 
                    placeholder="Search by name, email, or department..."
                >
            </div>

            <div class="table-wrapper">
                <table class="contacts-table" id="contactsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Position</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr id="emptyRow">
                            <td colspan="6" class="empty-message">No employees found. <a href="new-contact.html">Add one now</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Employee Management System. All rights reserved.</p>
    </footer>

    <!-- Modal for Details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
            <h2>Employee Details</h2>
            <div id="modalBodyDetails"></div>
            <button class="btn btn-secondary" onclick="closeDetailsModal()">Close</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
